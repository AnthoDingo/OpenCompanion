name: firmware

on:
  push:
    paths:
      - 'esp32/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'esp32/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - run: pio run -d esp32
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: esp32/.pio/build/*/firmware.bin
