name: emulator

on:
  push:
    paths:
      - 'Emulator/**'
      - '.github/workflows/emulator.yml'
    # tag vX.Y.Z : publie Emulator.zip dans la release (app.yml y ajoute TeamsCompanion.zip)
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'Emulator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet publish Emulator -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Emulator
          path: publish
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Emulator.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Emulator.zip
