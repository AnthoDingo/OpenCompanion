name: app

on:
  push:
    paths:
      - 'TeamsCompanion/**'
      - 'sprites/**'
      - '.github/workflows/app.yml'
    # tag vX.Y.Z : publie OpenCompanion-Setup.exe et TeamsCompanion.zip dans la release (emulator.yml y ajoute Emulator.zip)
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'TeamsCompanion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet run --project TeamsCompanion -- --test
      # Version : celle du tag vX.Y.Z, sinon <Version> de TeamsCompanion.csproj.
      - shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { dotnet msbuild TeamsCompanion -getProperty:Version }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
      # Autonome : l'utilisateur n'a pas à installer le runtime .NET. Traductions limitées aux langues de l'appli.
      - run: dotnet publish TeamsCompanion -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.APP_VERSION }} "-p:SatelliteResourceLanguages=fr%3Ben%3Bde%3Bes%3Bit%3Bpt"
      # Installeur compilé à chaque build : une erreur dans installer.iss se voit avant le tag.
      - shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q "/DAppVersion=$env:APP_VERSION" TeamsCompanion\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCompanion-Setup
          path: publish-installer/OpenCompanion-Setup.exe
      # Signature détachée ECDSA P-256 / SHA-256 (DER) de l'installeur, vérifiée par l'appli avant toute mise à jour auto.
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.APP_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { Write-Error "secret APP_SIGNING_KEY manquant"; exit 1 }
          # Jamais Set-Content : en erreur, PowerShell affiche la clé comme chemin et le masquage GitHub la rate.
          [IO.File]::WriteAllText("$PWD\signing.pem", $env:SIGNING_KEY)
          openssl dgst -sha256 -sign signing.pem -out publish-installer/OpenCompanion-Setup.exe.sig publish-installer/OpenCompanion-Setup.exe
          $code = $LASTEXITCODE
          Remove-Item signing.pem
          exit $code
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath TeamsCompanion.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish-installer/OpenCompanion-Setup.exe
            publish-installer/OpenCompanion-Setup.exe.sig
            TeamsCompanion.zip
