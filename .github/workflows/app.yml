name: app

on:
  push:
    paths:
      - 'TeamsCompanion/**'
      - '.github/workflows/app.yml'
    # tag vX.Y.Z : publie TeamsCompanion.zip dans la release (emulator.yml y ajoute Emulator.zip)
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'TeamsCompanion/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet run --project TeamsCompanion -- --test
      - run: dotnet publish TeamsCompanion -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TeamsCompanion
          path: publish
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath TeamsCompanion.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TeamsCompanion.zip
